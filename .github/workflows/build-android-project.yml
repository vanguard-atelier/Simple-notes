name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Spawn Keystores Everywhere
        run: |
          # 1. Project root (where Simple-notes is throwing hands)
          keytool -genkey -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          # 2. app/ subfolder just in case it looks there next
          mkdir -p app
          cp ./debug.keystore ./app/debug.keystore
          # 3. Default Android home path
          mkdir -p ~/.android
          cp ./debug.keystore ~/.android/debug.keystore

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Simple-Notes-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
