buildscript {
    ext {
        version_gradle_tools = '8.13.0'
        version_plugin_kotlin = '2.1.10'
        version_compileSdk = 35
        version_minSdk = 24
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:${version_gradle_tools}"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${version_plugin_kotlin}"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:${version_plugin_kotlin}"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
